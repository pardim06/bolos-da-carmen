<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Bolos da Carmen — Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=block" rel="stylesheet" />
<style>
  /* Página usada para exportar a logo em PNG (fundo transparente).
     Abra com #principal, #branco, #horizontal ou #icone. */
  html, body { margin: 0; background: transparent; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .logo { display: flex; flex-direction: column; align-items: center; color: var(--c); --c: #a8243f; --sub: #c4506c; }
  .logo.branco { --c: #fff7f2; --sub: #f6c9cf; }
  .logo svg { width: 150px; height: 150px; margin-bottom: -6px; }
  .top { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 30px; letter-spacing: .62em; margin-right: -.62em; text-transform: uppercase; line-height: 1; }
  .name { font-family: "Great Vibes", cursive; font-size: 168px; line-height: .9; margin-top: 30px; padding: 0 30px; }
  .tag { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 20px; letter-spacing: .4em; margin-right: -.4em; text-transform: uppercase; color: var(--sub); display: flex; align-items: center; gap: 16px; margin-top: 4px; }
  .tag::before, .tag::after { content: ""; width: 46px; height: 1.5px; background: currentColor; }

  .logo.horizontal { flex-direction: row; gap: 18px; }
  .logo.horizontal svg { width: 120px; height: 120px; margin: 0; }
  .logo.horizontal .txt { display: flex; flex-direction: column; align-items: flex-start; }
  .logo.horizontal .top { font-size: 22px; padding-left: 84px; margin-bottom: 14px; }
  .logo.horizontal .name { font-size: 112px; padding: 0 16px 0 0; margin-top: 0; }
  .logo.icone svg { width: 480px; height: 480px; margin: 0; }
</style>
</head>
<body>
<div id="out"></div>
<script>
function icon(c, f1, f2) {
  return `<svg viewBox="0 0 120 120" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M60 18 C61 11 66 7 73 6"/><path d="M66 9 C70 4 77 4 80 8 C75 11 70 11 66 9 Z" fill="${f1}"/>
  <circle cx="58" cy="24" r="7" fill="${f2}"/><path d="M55.5 21.5 q1.5 -1.5 3.5 -1" stroke="#fff7f2" stroke-width="2"/>
  <rect x="37" y="34" width="46" height="24" rx="4" fill="${f1}"/>
  <path d="M37 38 a4 4 0 0 1 4 -4 h38 a4 4 0 0 1 4 4 v5 c-2 0 -3 1.5 -3 4 v3 a3 3 0 0 1 -6 0 v-4 c0 -2 -1.5 -3 -3.5 -3 s-3.5 1 -3.5 3 v8 a3.2 3.2 0 0 1 -6.4 0 v-6 c0 -2 -1.5 -3 -3.3 -3 s-3.3 1 -3.3 3 v2 a3 3 0 0 1 -6 0 v-3 c0 -2.5 -1 -4 -3 -4 z" fill="${f2}"/>
  <rect x="25" y="58" width="70" height="30" rx="5" fill="${f1}"/>
  <path d="M29 70 q5.5 7 11 0 q5.5 7 11 0 q5.5 7 11 0 q5.5 7 11 0 q5.5 7 11 0 q5.5 7 11 0"/>
  <g fill="${c}" stroke="none">${[34.5,45.5,56.5,67.5,78.5,89.5].map(x=>`<circle cx="${x}" cy="80" r="1.8"/>`).join("")}</g>
  <path d="M15 92 h90"/><path d="M50 92 l-5 12 h30 l-5 -12" fill="${f1}"/></svg>`;
}
if (location.search.includes("x2")) { document.body.style.zoom = 2; document.body.style.minHeight = "50vh"; }
const v = (location.hash || "#principal").slice(1);
const cor = v === "branco" ? icon("#fff7f2", "rgba(255,247,242,.12)", "#e2728f") : icon("#a8243f", "#fbe3e0", "#e2728f");
const out = document.getElementById("out");
if (v === "icone") out.innerHTML = `<div class="logo icone">${cor}</div>`;
else if (v === "horizontal") out.innerHTML = `<div class="logo horizontal">${cor}<div class="txt"><span class="top">Bolos da</span><span class="name">Carmen</span></div></div>`;
else out.innerHTML = `<div class="logo ${v === "branco" ? "branco" : ""}">${cor}<span class="top">Bolos da</span><span class="name">Carmen</span><span class="tag">confeitaria afetiva</span></div>`;
</script>
</body>
</html>
